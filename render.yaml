services:
  # Monolithic Docker Web Service (Backend + Static Frontend + FFmpeg + Python)
  - type: web
    name: yt-clipper
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_PATH
        value: python3
      # Optional: Add your API keys for enhanced LLM highlighting
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
